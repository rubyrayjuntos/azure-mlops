name: 'Read YAML Config'
description: 'Parses a config-infra-*.yml file and derives resource naming outputs. Vendored replacement for Azure/mlops-templates/read_yaml_action (no external action dependency).'
inputs:
  config:
    description: 'Path to the config yaml file, relative to the repo root'
    required: true
outputs:
  location:
    description: 'The location of the AML workspace'
    value: ${{ steps.parse.outputs.location }}
  namespace:
    description: 'Namespace for the resources'
    value: ${{ steps.parse.outputs.namespace }}
  postfix:
    description: 'Postfix for the resource names'
    value: ${{ steps.parse.outputs.postfix }}
  environment:
    description: 'Environment of the AML workspace'
    value: ${{ steps.parse.outputs.environment }}
  enable_aml_computecluster:
    description: 'Whether to deploy an AML compute cluster'
    value: ${{ steps.parse.outputs.enable_aml_computecluster }}
  enable_monitoring:
    description: 'Whether to enable monitoring'
    value: ${{ steps.parse.outputs.enable_monitoring }}
  resource_group:
    description: 'The resource group the AML workspace is in'
    value: ${{ steps.parse.outputs.resource_group }}
  aml_workspace:
    description: 'The AML workspace name'
    value: ${{ steps.parse.outputs.aml_workspace }}
  bep:
    description: 'The batch endpoint name'
    value: ${{ steps.parse.outputs.bep }}
  oep:
    description: 'The online endpoint name'
    value: ${{ steps.parse.outputs.oep }}
  terraform_version:
    description: 'Terraform version'
    value: ${{ steps.parse.outputs.terraform_version }}
  terraform_workingdir:
    description: 'Terraform State working directory'
    value: ${{ steps.parse.outputs.terraform_workingdir }}
  terraform_st_location:
    description: 'Terraform State location'
    value: ${{ steps.parse.outputs.terraform_st_location }}
  terraform_st_resource_group:
    description: 'Terraform State resource group'
    value: ${{ steps.parse.outputs.terraform_st_resource_group }}
  terraform_st_storage_account:
    description: 'Terraform State storage account'
    value: ${{ steps.parse.outputs.terraform_st_storage_account }}
  terraform_st_container_name:
    description: 'Terraform State container name'
    value: ${{ steps.parse.outputs.terraform_st_container_name }}
  terraform_st_key:
    description: 'Terraform State key'
    value: ${{ steps.parse.outputs.terraform_st_key }}
runs:
  using: 'composite'
  steps:
    - id: parse
      shell: bash
      run: |
        set -euo pipefail
        CONFIG="${{ inputs.config }}"

        get() {
          local v
          v=$(yq -r ".variables.$1" "$CONFIG")
          [ "$v" = "null" ] && v=""
          echo "$v"
        }

        namespace=$(get namespace)
        postfix=$(get postfix)
        environment=$(get environment)
        location=$(get location)
        enable_aml_computecluster=$(get enable_aml_computecluster)
        enable_monitoring=$(get enable_monitoring)
        resource_group=$(get resource_group)
        aml_workspace=$(get aml_workspace)
        terraform_version=$(get terraform_version)
        terraform_workingdir=$(get terraform_workingdir)
        terraform_st_location=$(get terraform_st_location)
        terraform_st_resource_group=$(get terraform_st_resource_group)
        terraform_st_storage_account=$(get terraform_st_storage_account)
        terraform_st_container_name=$(get terraform_st_container_name)
        terraform_st_key=$(get terraform_st_key)

        # Values still containing an unexpanded $(...) placeholder are derived instead.
        needs_generation() { [[ "$1" == *'$'* || -z "$1" ]]; }

        needs_generation "$terraform_st_location" && terraform_st_location="$location"
        needs_generation "$resource_group" && resource_group="rg-${namespace}-${postfix}${environment}"
        needs_generation "$aml_workspace" && aml_workspace="mlw-${namespace}-${postfix}${environment}"
        needs_generation "$terraform_st_resource_group" && terraform_st_resource_group="rg-${namespace}-${postfix}${environment}-tf"
        needs_generation "$terraform_st_storage_account" && terraform_st_storage_account="st${namespace}${postfix}${environment}tf"

        bep="bep-${namespace}-${postfix}${environment}"
        oep="oep-${namespace}-${postfix}${environment}"

        {
          echo "location=$location"
          echo "namespace=$namespace"
          echo "postfix=$postfix"
          echo "environment=$environment"
          echo "enable_aml_computecluster=$enable_aml_computecluster"
          echo "enable_monitoring=$enable_monitoring"
          echo "resource_group=$resource_group"
          echo "aml_workspace=$aml_workspace"
          echo "bep=$bep"
          echo "oep=$oep"
          echo "terraform_version=$terraform_version"
          echo "terraform_workingdir=$terraform_workingdir"
          echo "terraform_st_location=$terraform_st_location"
          echo "terraform_st_resource_group=$terraform_st_resource_group"
          echo "terraform_st_storage_account=$terraform_st_storage_account"
          echo "terraform_st_container_name=$terraform_st_container_name"
          echo "terraform_st_key=$terraform_st_key"
        } >> "$GITHUB_OUTPUT"
